# Every pull request is checked. The `prod` stage is deployed, once the
# commit to deploy passes the same check, when either:
# - a pull request labelled `prod` (stacks/github.ts) is merged: the commit it
#   left on main is deployed;
# - a commit whose message is exactly `trigger: deploy prod` is pushed to main,
#   as `bun run trigger:deploy` makes: main is deployed as it is.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

jobs:
  # Runs for every open pull request, and for every event that deploys: the
  # deploy job needs it, so nothing is deployed that did not pass it.
  check:
    if: >-
      (github.event_name == 'pull_request' &&
        (github.event.action != 'closed' ||
          (github.event.pull_request.merged &&
            contains(github.event.pull_request.labels.*.name, 'prod')))) ||
      (github.event_name == 'push' &&
        github.event.head_commit.message == 'trigger: deploy prod')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # A merged pull request is checked on the commit it left on main.
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  deploy:
    needs: check
    # The check only ran for an event that deploys, and only passed if it passed.
    if: github.event_name == 'push' || github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: prod
    # One deploy at a time, and never one cancelled halfway.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Write .env.prod
        run: printf '%s\n' "$ENV_DEPLOY" > .env.prod
        env:
          ENV_DEPLOY: ${{ secrets.ENV_DEPLOY }}
      - run: bunx alchemy provider check-env --provider Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: bunx alchemy provider check-env --provider Axiom
        env:
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      # Nobody is there to approve the plan: the label or the trigger commit was the approval.
      - run: bun run deploy --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
